<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFR MySQL Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        .stat-card h3 {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        select, input, button {
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
            margin-right: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #45a049;
        }
        .table-container {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #333;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #4CAF50;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        tr:hover {
            background: #333;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .error {
            background: #ff5252;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .refresh-info {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 CFR MySQL Live Viewer</h1>
        <p style="color: #888; margin-bottom: 20px;">Real-time database visualization - Auto-refreshes every 10 seconds</p>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3>TITLES</h3>
                <div class="value" id="titles-count">-</div>
            </div>
            <div class="stat-card">
                <h3>PARTS</h3>
                <div class="value" id="parts-count">-</div>
            </div>
            <div class="stat-card">
                <h3>SECTIONS</h3>
                <div class="value" id="sections-count">-</div>
            </div>
            <div class="stat-card">
                <h3>FILES PROCESSED</h3>
                <div class="value" id="files-count">-</div>
            </div>
        </div>

        <div class="controls">
            <label>View: </label>
            <select id="view-select" onchange="loadData()">
                <option value="titles">Titles</option>
                <option value="parts">Parts (Latest 50)</option>
                <option value="sections">Sections (Latest 50)</option>
                <option value="search">Search Sections</option>
            </select>
            
            <input type="text" id="search-input" placeholder="Search..." style="display: none;">
            <button onclick="loadData()">Refresh</button>
            <button onclick="toggleAutoRefresh()" id="auto-refresh-btn">Auto-Refresh: ON</button>
            
            <div class="refresh-info">Last updated: <span id="last-update">-</span></div>
        </div>

        <div class="table-container">
            <div id="data-display" class="loading">Loading...</div>
        </div>
    </div>

    <script>
        let autoRefresh = true;
        let refreshInterval;

        async function executeSQL(query) {
            try {
                const response = await fetch('http://localhost:3306', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                return await response.json();
            } catch (error) {
                console.error('Error:', error);
                return { error: error.message };
            }
        }

        async function loadStats() {
            // Note: This is a demo - in production, you'd use a proper API
            // For now, we'll show instructions to use docker commands
            document.getElementById('titles-count').textContent = 'Use CLI';
            document.getElementById('parts-count').textContent = 'Use CLI';
            document.getElementById('sections-count').textContent = 'Use CLI';
            document.getElementById('files-count').textContent = 'Use CLI';
        }

        async function loadData() {
            const view = document.getElementById('view-select').value;
            const display = document.getElementById('data-display');
            const searchInput = document.getElementById('search-input');
            
            if (view === 'search') {
                searchInput.style.display = 'inline-block';
            } else {
                searchInput.style.display = 'none';
            }

            display.innerHTML = '<div class="loading">Use command line tools for now...</div>';
            display.innerHTML += '<pre style="color: #888; padding: 20px; font-size: 12px;">';
            display.innerHTML += 'To view data, use these commands:\\n\\n';
            display.innerHTML += './view_data.sh counts\\n';
            display.innerHTML += './view_data.sh titles\\n';
            display.innerHTML += './view_data.sh parts 42\\n';
            display.innerHTML += './view_data.sh sections 400\\n';
            display.innerHTML += './view_data.sh search "keyword"\\n';
            display.innerHTML += '\\nOr use phpMyAdmin at: http://localhost:8081\\n';
            display.innerHTML += '(Starting up now...)';
            display.innerHTML += '</pre>';
            
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
        }

        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('auto-refresh-btn');
            btn.textContent = `Auto-Refresh: ${autoRefresh ? 'ON' : 'OFF'}`;
            
            if (autoRefresh) {
                startAutoRefresh();
            } else {
                clearInterval(refreshInterval);
            }
        }

        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                if (autoRefresh) {
                    loadStats();
                    loadData();
                }
            }, 10000);
        }

        // Initialize
        loadStats();
        loadData();
        startAutoRefresh();
    </script>
</body>
</html>
